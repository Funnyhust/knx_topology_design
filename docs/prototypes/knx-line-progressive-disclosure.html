<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KNX Progressive Line Prototype</title>
<style>
:root{--blue:#2878db;--green:#16ad69;--ink:#172033;--muted:#647084;--line:#d9e1ea;--panel:#fff;--canvas:#f7f9fc;--soft:#eef5ff;--warning:#d99216}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:#fff}
button{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-rows:72px 1fr 34px;grid-template-columns:292px 1fr 318px;background:#fff}
.topbar{grid-column:1/4;display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:#fff;z-index:5}
.brand{width:292px;display:flex;align-items:center;gap:18px;padding:0 26px;border-right:1px solid var(--line)}
.knx{font-size:25px;font-weight:800;letter-spacing:-1px;color:#168e63}.brandName{font-size:16px;font-weight:700}.toolbar{flex:1;display:flex;justify-content:center;gap:2px}
.tool{width:92px;border:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#465166}
.toolIcon{font-size:19px;color:#54657c}.tool.active{background:#edf5ff;color:#176bd1;border-bottom:2px solid #3182e5}.tool.dim{color:#a7aebb}
.left,.right,.canvas{min-width:0;min-height:0;background:#fff}.left{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}.right{border-left:1px solid var(--line);overflow:hidden}
.panelTitle{height:54px;padding:18px 22px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700}.scenarioPicker,.modePicker{display:flex;gap:7px;padding:12px 16px;border-bottom:1px solid #e8edf3}.modePicker{gap:4px}.modePicker .chip{padding:7px 6px;font-size:11px}
.chip{border:1px solid #ccd6e2;background:#fff;border-radius:7px;padding:7px 10px;font-size:12px;cursor:pointer}.chip.active{background:#e9f3ff;border-color:#63a4ec;color:#1267c7;font-weight:700}
.tree{padding:14px 12px 8px;overflow:auto;flex:1;font-size:13px}.treeRow{height:30px;display:flex;align-items:center;gap:8px;border-radius:6px;white-space:nowrap}.treeRow.selected{background:#e9f2ff;color:#1267c7}.treeAddress{margin-left:auto;color:#3578cf}.caret{width:12px;text-align:center;color:#657184}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.search{margin:10px 14px 14px;height:38px;border:1px solid #ccd6e2;border-radius:7px;color:#8a94a3;padding:10px 12px;font-size:12px}
.canvas{position:relative;overflow:auto;background-color:var(--canvas);background-image:linear-gradient(#edf1f6 1px,transparent 1px),linear-gradient(90deg,#edf1f6 1px,transparent 1px);background-size:20px 20px}
.stage{position:relative;min-width:1260px;min-height:930px;padding:26px 44px 48px 86px}.canvasTools{position:sticky;z-index:4;top:14px;left:16px;width:max-content;display:flex;background:#fff;border:1px solid #d5dee9;border-radius:8px;box-shadow:0 2px 8px #32425c18;overflow:hidden}
.canvasTools button{width:40px;height:36px;border:0;border-right:1px solid #e4e9ef;background:#fff}.canvasTools button:last-child{border:0}.scale{width:auto!important;padding:0 12px;color:#536177}
.backbone{position:absolute;left:68px;top:90px;width:3px;height:760px;background:#2684dd}.backboneLabel{position:absolute;left:39px;top:410px;transform:rotate(-90deg);color:#2378ce;font-size:12px;font-weight:700}
.area{position:relative;margin:22px 0 0 34px;width:calc(100% - 54px);min-height:790px;border:1px solid #9ec1e8;border-radius:13px;background:#ffffffd9;box-shadow:0 6px 18px #4369920b;padding:58px 28px 28px}
.areaHeader{position:absolute;left:20px;right:20px;top:14px;display:flex;align-items:center;gap:12px}.areaName{font-size:17px;font-weight:750}.badge{padding:2px 7px;border-radius:6px;background:#e8f2ff;color:#166dcc;font-weight:700}.summary{font-size:12px;color:#667287}.kebab{margin-left:auto;font-size:20px;color:#6f7a8c}
.mainBus{position:relative;height:54px;margin-left:58px;border-top:3px solid var(--green)}.mainBus:before{content:"AC";position:absolute;left:-58px;top:-24px;width:42px;height:42px;border-radius:7px;background:#4c9cdc;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}.mainBusLabel{position:absolute;left:43%;top:-25px;font-size:12px;font-weight:650}
.secondaryZone{margin:23px 6px 0 75px;position:relative}.lineSummary{width:390px;height:82px;border:1px solid #bfcbd8;border-radius:9px;background:#fff;box-shadow:0 2px 7px #263b5812;display:grid;grid-template-columns:64px 1fr 32px;align-items:center;padding-right:12px}.lcBox{height:100%;display:grid;place-content:center;background:#fff7dc;border-right:1px solid #efcc55;color:#865f00;font-size:12px;font-weight:800;border-radius:9px 0 0 9px}.summaryTitle{font-size:15px;font-weight:750;margin-left:16px}.summaryMeta{font-size:12px;color:#6b7688;margin:6px 0 0 16px}.chevron{font-size:18px;color:#748095}
.linePanel{position:relative;border:1px solid #c5d5e7;border-radius:10px;background:#fbfdff;padding:48px 22px 20px 72px;min-height:190px}.linePanelTitle{position:absolute;left:18px;top:14px;font-size:15px;font-weight:750}.linePanelMeta{font-weight:400;color:#728096;font-size:12px;margin-left:9px}.coupler{position:absolute;left:16px;top:67px;width:42px;height:42px;border-radius:6px;background:#ffd458;border:1px solid #d9ad31;display:grid;place-content:center;text-align:center;font-size:10px;font-weight:800;color:#5f4900}.band{position:relative;height:105px;border-top:3px solid var(--green);display:flex;align-items:flex-start;gap:16px;padding:21px 10px 0 18px}.band+.band{margin-top:40px}.band+.band:before{content:"continuation";position:absolute;right:6px;top:-25px;font-size:10px;color:#718095}.band+.band:after{content:"↳";position:absolute;right:-1px;top:-47px;color:var(--green);font-size:23px;font-weight:800}.device{position:relative;width:142px;height:58px;background:#fff;border:1px solid #c5ced9;border-radius:7px;box-shadow:0 2px 6px #293a5012;display:grid;grid-template-columns:34px 1fr;align-items:center;padding:6px 8px}.device:before{content:"";position:absolute;left:50%;top:-24px;width:2px;height:23px;background:var(--green)}.deviceIcon{width:27px;height:27px;border-radius:6px;background:#eef4fa;display:grid;place-items:center;color:#344a62}.deviceName{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.deviceAddress{font-size:10px;color:#2472ca;margin-top:4px}.more{align-self:center;border:1px dashed #79aee7;color:#1468c5;background:#f3f8ff;border-radius:7px;height:40px;padding:0 15px;font-weight:700;font-size:12px}.compact .linePanel{min-height:205px}.compact .band{margin-top:10px}.expanded .linePanel{padding-bottom:26px}.focusHeader{height:44px;display:flex;align-items:center;gap:12px;margin-bottom:14px}.back{height:34px;border:1px solid #bac8d8;background:#fff;border-radius:7px;padding:0 13px;color:#2369b2}.focusTitle{font-size:18px;font-weight:750}.focus .area{border:0;background:transparent;box-shadow:none;padding-left:0;padding-right:0;margin-left:5px;width:calc(100% - 10px)}.focus .areaHeader,.focus .mainBus{display:none}.focus .secondaryZone{margin:0}.focus .linePanel{border-color:#83b6ec;box-shadow:0 8px 24px #2b65a514}
.secondaryGhosts{display:flex;gap:18px;margin-top:20px}.ghostLine{width:250px;height:54px;border:1px solid #d4dce5;border-radius:8px;background:#fff;color:#778396;padding:10px 13px;font-size:12px}.ghostLine strong{color:#3d4858}.rightBody{padding:18px}.objectType{font-size:17px;font-weight:750}.breadcrumb{font-size:11px;color:#6b778a;margin:6px 0 20px}.section{border-top:1px solid #e2e7ed;padding:15px 0}.sectionTitle{font-size:12px;font-weight:750;margin-bottom:12px}.field{display:grid;grid-template-columns:92px 1fr;align-items:center;margin:9px 0;font-size:11px;color:#667286}.fieldValue{height:33px;border:1px solid #ccd5df;border-radius:6px;background:#fff;color:#2d394a;padding:8px 10px;font-size:12px}.notice{border-radius:7px;background:#edf8f2;color:#247347;padding:10px 11px;font-size:11px}.status{grid-column:1/4;border-top:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 18px;font-size:11px;color:#5f6b7e}.statusOk{color:#168b55}.statusSpacer{flex:1}
.band{height:92px}.area.collapsed{min-height:340px}.area.compact{min-height:430px}.area.focus{min-height:0;border:0;background:transparent;box-shadow:none;padding:0;margin:0 0 0 5px;width:calc(100% - 10px)}.area.focus .areaHeader,.area.focus .mainBus{display:none}.area.focus .secondaryZone{margin:0}.area.focus .linePanel{border-color:#83b6ec;box-shadow:0 8px 24px #2b65a514}
@media(max-width:1400px){.app{grid-template-columns:240px 1fr 270px}.brand{width:240px}.tool{width:78px}.stage{min-width:1080px}.device{width:128px}.band{gap:12px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="knx">KNX</div><div class="brandName">KNX Topology</div></div>
    <div class="toolbar">
      <button class="tool"><span class="toolIcon">⊞</span>Add Area</button><button class="tool"><span class="toolIcon">⇆</span>Add Line</button><button class="tool"><span class="toolIcon">▦</span>Add Device</button><button class="tool dim"><span class="toolIcon">#</span>Assign</button><button class="tool"><span class="toolIcon">✓</span>Validate</button><button class="tool"><span class="toolIcon">☷</span>Layout</button><button class="tool"><span class="toolIcon">↙</span>Fit Project</button><button class="tool"><span class="toolIcon">↶</span>Undo</button><button class="tool"><span class="toolIcon">↷</span>Redo</button><button class="tool active"><span class="toolIcon">▣</span>Topology</button>
    </div>
  </header>
  <aside class="left">
    <div class="panelTitle">Topology Tree</div>
    <div class="scenarioPicker" id="scenarioPicker"></div>
    <div class="modePicker" id="modePicker"></div>
    <div class="tree" id="tree"></div><div class="search">⌕ &nbsp; Search topology…</div>
  </aside>
  <main class="canvas"><div class="stage">
    <div class="canvasTools"><button>−</button><button>＋</button><button>▣</button><button class="scale">100%</button></div>
    <div class="backbone"></div><div class="backboneLabel">Backbone · 0.0</div>
    <section class="area" id="area"><div class="areaHeader"><span class="areaName">Area 1</span><span class="badge">1</span><span class="summary" id="areaSummary"></span><span class="kebab">•••</span></div><div class="mainBus"><span class="mainBusLabel">Main Line 1.0</span></div><div class="secondaryZone" id="secondary"></div></section>
  </div></main>
  <aside class="right"><div class="panelTitle">Properties</div><div class="rightBody" id="properties"></div></aside>
  <footer class="status"><span class="statusOk">● Topology ready</span><span>Areas: 3</span><span>Lines: 7</span><span id="deviceStatus"></span><span class="statusSpacer"></span><span id="viewStatus"></span><span>Zoom: 100%</span></footer>
</div>
<script>
(function(){
  var params=new URLSearchParams(location.search);var count=parseInt(params.get('devices')||'12',10);var mode=params.get('mode')||'expanded';
  var counts=[4,12,30],modes=['collapsed','compact','expanded','focus'];
  function link(c,m){return '?devices='+c+'&mode='+m}
  document.getElementById('scenarioPicker').innerHTML=counts.map(function(c){return '<button class="chip '+(c===count?'active':'')+'" onclick="location.href=\''+link(c,mode)+'\'">'+c+' Dev</button>'}).join('');
  document.getElementById('modePicker').innerHTML=modes.map(function(m){return '<button class="chip '+(m===mode?'active':'')+'" onclick="location.href=\''+link(count,m)+'\'">'+m[0].toUpperCase()+m.slice(1)+'</button>'}).join('');
  function device(i){var n=i+1;return '<div class="device"><div class="deviceIcon">◇</div><div><div class="deviceName">KNX Device '+n+'</div><div class="deviceAddress">1.1.'+n+'</div></div></div>'}
  var tree='<div class="treeRow"><span class="caret">▾</span><b>KNX Project</b></div><div class="treeRow" style="padding-left:20px"><span class="caret">›</span>Backbone <span class="treeAddress">0.0</span></div><div class="treeRow" style="padding-left:20px"><span class="caret">▾</span>Area 1 <span class="treeAddress">1</span></div><div class="treeRow" style="padding-left:40px">AC&nbsp; Area Coupler <span class="treeAddress">1.0.0</span></div><div class="treeRow" style="padding-left:40px"><span class="caret">▾</span>Main Line <span class="treeAddress">1.0</span></div><div class="treeRow selected" style="padding-left:60px"><span class="caret">▾</span>Line 1.1 <span class="treeAddress">1.1</span></div><div class="treeRow" style="padding-left:78px">LC&nbsp; Line Coupler <span class="treeAddress">1.1.0</span></div>';
  for(var i=0;i<count;i++){tree+='<div class="treeRow" style="padding-left:82px"><span class="dot"></span>Device '+(i+1)+' <span class="treeAddress">1.1.'+(i+1)+'</span></div>'}document.getElementById('tree').innerHTML=tree;
  document.getElementById('areaSummary').textContent='Main Line 1.0  ·  3 Lines  ·  '+count+' Devices';document.getElementById('deviceStatus').textContent='Devices: '+count;document.getElementById('viewStatus').textContent=(mode==='focus'?'Focus Line':'Project Overview')+' · '+mode;
  var secondary=document.getElementById('secondary'),area=document.getElementById('area');
  area.classList.add(mode);
  if(mode==='collapsed'){
    secondary.innerHTML='<div class="lineSummary"><div class="lcBox">LC<br>1.1.0</div><div><div class="summaryTitle">Line 1.1</div><div class="summaryMeta">'+count+' Devices · 0 Warnings · Auto</div></div><div class="chevron">⌄</div></div><div class="secondaryGhosts"><div class="ghostLine"><strong>Line 1.2</strong><br>5 Devices · Compact</div><div class="ghostLine"><strong>Line 1.3</strong><br>2 Devices · Compact</div></div>';
  }else{
    var visible=mode==='compact'?Math.min(4,count):count;var bandSize=5;var bands=[];
    for(var start=0;start<visible;start+=bandSize){var row='';for(var j=start;j<Math.min(start+bandSize,visible);j++)row+=device(j);if(mode==='compact'&&count>visible)row+='<button class="more">+ '+(count-visible)+' more</button>';bands.push('<div class="band">'+row+'</div>')}
    var focusHeader=mode==='focus'?'<div class="focusHeader"><button class="back">← Back to Project</button><div class="focusTitle">Line 1.1 Detail</div><span class="badge">'+count+' Devices</span></div>':'';
    secondary.innerHTML=focusHeader+'<div class="linePanel"><div class="linePanelTitle">Line 1.1 <span class="linePanelMeta">LC 1.1.0 · '+count+' Devices</span></div><div class="coupler">LC<br>1.1.0</div>'+bands.join('')+'</div>';
  }
  var selected=Math.min(count,mode==='compact'?4:count);document.getElementById('properties').innerHTML='<div class="objectType">'+(mode==='collapsed'?'KNX Line':'KNX Device '+selected)+'</div><div class="breadcrumb">Area 1 › Main Line 1.0 › Line 1.1'+(mode==='collapsed'?'':' › Device 1.1.'+selected)+'</div><div class="section"><div class="sectionTitle">General</div><div class="field"><span>Name</span><div class="fieldValue">'+(mode==='collapsed'?'Line 1.1':'KNX Device '+selected)+'</div></div><div class="field"><span>Address</span><div class="fieldValue">'+(mode==='collapsed'?'1.1':'1.1.'+selected)+'</div></div><div class="field"><span>Type</span><div class="fieldValue">'+(mode==='collapsed'?'KNX Line':'KNX Device')+'</div></div></div><div class="section"><div class="sectionTitle">Topology</div><div class="field"><span>Parent</span><div class="fieldValue">'+(mode==='collapsed'?'Main Line 1.0':'Line 1.1')+'</div></div><div class="field"><span>View</span><div class="fieldValue">'+mode+'</div></div></div><div class="section"><div class="sectionTitle">Validation</div><div class="notice">✓ No topology issues found</div></div>';
})();
</script>
</body>
</html>
